<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h2 class="fw-bold mb-4">Edit Listing</h2>
      <form (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" id="title" class="form-control" [(ngModel)]="listing.title" name="title" required />
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" class="form-control" [(ngModel)]="listing.description" name="description" rows="4" required></textarea>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">Price ($)</label>
          <input type="number" id="price" class="form-control" [(ngModel)]="listing.price" name="price" required min="0" />
        </div>

        <div class="mb-3">
          <label for="quantity" class="form-label">Quantity</label>
          <input type="number" id="quantity" class="form-control" [(ngModel)]="listing.quantity" name="quantity" required min="0" />
        </div>

        <div class="mb-3">
          <label for="condition" class="form-label">Condition</label>
          <select id="condition" class="form-select" [(ngModel)]="listing.condition" name="condition" required>
            <option value="" disabled>Select condition</option>
            <option>New</option>
            <option>Like New</option>
            <option>Good</option>
            <option>Fair</option>
            <option>Poor</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="location" class="form-label">Location</label>
          <input type="text" id="location" class="form-control" [(ngModel)]="listing.location" name="location" required />
        </div>

        <div class="mb-4">
          <label class="form-label">Categories</label>
          <select multiple class="form-select" [(ngModel)]="listing.categories" name="categories">
            <option>Electronics</option>
            <option>Clothing &amp; Accessories</option>
            <option>Furniture</option>
            <option>Vehicles</option>
            <option>Home &amp; Garden</option>
            <option>Toys &amp; Games</option>
            <option>Sports &amp; Outdoors</option>
            <option>Books &amp; Media</option>
            <option>Musical Instruments</option>
            <option>Tools &amp; Hardware</option>
            <option>Pet Supplies</option>
            <option>Free Items</option>
            <option>Other</option>
          </select>
          <div class="form-text">Hold Ctrl / Cmd to select multiple categories</div>
        </div>

        <div class="mb-4">
          <label for="image" class="form-label">Image</label>
          @if (imagePreview) {
            <img [src]="imagePreview" class="d-block mb-2 rounded" style="max-height: 200px; object-fit: cover; width: 100%;" alt="Current image" />
          }
          <input type="file" id="image" class="form-control" accept="image/*" (change)="onImageSelected($event)" />
          <div class="form-text">Upload a new image to replace the current one</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">Save Changes</button>
          <a routerLink="/listings" class="btn btn-outline-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>
