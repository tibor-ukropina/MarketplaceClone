name: second-action.yml
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: marketplace-ui
        run: npm ci
      - name: Run tests
        working-directory: marketplace-ui
        run: npm test

